# .github/workflows/gem-push.yml
name: Gem Push

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ruby: ["3.0", "3.1", "3.2", "3.3", "3.4", "4.0"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oxidize-rb/actions/setup-ruby-and-rust@835741039e37f5bbd9a62804dc03b115739bc880 # node24 and cache v5
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: git submodule init
      - run: git submodule update
      - run: bundle exec rake compile
      - run: bundle exec rake test

  cross-compile:
    needs: [test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: ["aarch64-linux", "aarch64-linux-musl", "arm64-darwin", "x64-mingw-ucrt", "x86_64-darwin", "x86_64-linux", "x86_64-linux-musl"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
      - uses: oxidize-rb/actions/cross-gem@835741039e37f5bbd9a62804dc03b115739bc880 # node24 and cache v5
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: "3.0,3.1,3.2,3.3,3.4,4.0"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gem-${{ matrix.platform }}
          path: pkg/*-${{ matrix.platform }}.gem

  release:
    needs: cross-compile
    runs-on: ubuntu-latest
    permissions:
      contents: write  # the GitHub Release (provenance backup of the artifacts)
      id-token: write  # OIDC for rubygems.org trusted publishing - no key exists
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.4"
          rubygems: latest
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Collect gems and checksums
        run: |
          mkdir -p pkg
          gem build typst.gemspec
          mv typst-*.gem pkg/
          find artifacts -name "*.gem" -exec mv {} pkg/ \;
          cd pkg && sha256sum *.gem > SHA256SUMS && cat SHA256SUMS
      - name: Attach artifacts to the tag's release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" pkg/*.gem pkg/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "CI-built gems (source + platforms). Verify against SHA256SUMS."
      # The credentials engine INSIDE the official rubygems/release-gem action
      # (same SHA it pins). release-gem itself is unusable here: its rake
      # release pushes only the single source gem, never pre-built platform
      # gems - the reason native gems run bespoke pipelines.
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Publish to rubygems.org
        run: |
          for g in pkg/*.gem; do
            gem push "$g"
          done
      - name: Wait for the release to propagate
        run: gem exec rubygems-await pkg/*.gem